baseURL = 'https://panzhengyi12.github.io/'
languageCode = 'zh-cn'
title = '我的个人博客'
theme = 'reimu'

# 告诉 Hugo 从 config/_default/ 加载配置
# [module]
#   [[module.imports]]
#     path = "themes/reimu"

[params]
  custom_css = ["css/custom.scss"]

mainSections = ["posts"]
  
  [params.paginate]
    post = 10


[markup]
  [markup.highlight]
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    style = "monokai"