baseURL = 'https://panzhengyi12.github.io/'
languageCode = 'zh-cn'
title = '我的个人博客'
theme = 'reimu'

# 告诉 Hugo 从 config/_default/ 加载配置
# [module]
#   [[module.imports]]
#     path = "themes/reimu"

[params]
  custom_css = ["css/custom.scss"]


  # 开启首页显示文章列表
  listOnHome = true
  # 指定文章来源的文件夹（改成你存放 .md 文件的文件夹名）
  mainSections = ["posts"]



[markup]
  [markup.highlight]
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    style = "monokai"